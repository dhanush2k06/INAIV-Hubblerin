# Render Blueprint configuration for HubblerX
# Docs: https://render.com/docs/blueprint-spec
# Deploy all 3 services at once: Dashboard → New → Blueprint → connect repo

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Express API (Web Service)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: hubblerx-backend
    runtime: node
    plan: free
    buildCommand: sh build-server.sh
    startCommand: sh start-server.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      # RENDER_EXTERNAL_URL is auto-injected by Render — activates the self-ping keep-alive
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: hubblerx-backend
          property: host
      # ── Secrets — fill these in Render dashboard → Environment ──
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_REPORT_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_REPLY_TO
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 2. Main Frontend App (Static Site)
  #    Render dashboard → Root Directory: hubblers
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: hubblerx-app
    runtime: static
    plan: free
    rootDir: hubblers
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 3. CRM Admin Dashboard (Static Site)
  #    Render dashboard → Root Directory: crm
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: hubblerx-crm
    runtime: static
    plan: free
    rootDir: crm
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
