<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HubblerX</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">Hubbler<span>X</span></a></div>
        <ul class="nav-links" id="navLinks">
            <!-- Filled by script.js -->
        </ul>
    </nav>

    <div class="container mt-16">
        <div class="auth-container" style="max-width: 600px;">
            <form class="auth-form" id="profileForm" style="position: relative;">
                <button type="button" id="editProfileBtn" class="btn btn-secondary" style="position: absolute; top: 1.5rem; right: 1.5rem; padding: 0.4rem 1rem; font-size: 0.85rem;">Edit</button>
                <h2 style="text-align: center;">Student Profile</h2>
                <p class="form-subtitle" style="text-align: center;">Manage your personal and academic information.</p>

                <div class="form-section">
                    <h3>Account Information</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profName" required placeholder="Your full name" readonly>
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="profMobile" required placeholder="Your mobile number" maxlength="10" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="profEmail" readonly title="Email cannot be changed">
                    </div>
                    <div class="form-group">
                        <label>Hubbler Handle</label>
                        <input type="text" id="profHandle" readonly title="Handle is permanent">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Academic Details</h3>
                    <div class="form-group">
                        <label>College</label>
                        <input type="text" id="profCollege" required placeholder="Your college name" readonly>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" id="profDept" required placeholder="Your department" readonly>
                        </div>
                        <div class="form-group">
                            <label>Roll Number</label>
                            <input type="text" id="profRoll" required placeholder="Your roll number" readonly>
                        </div>
                    </div>
                </div>

                <div id="saveStatus" style="text-align: center; margin-bottom: 1rem; font-size: 0.9rem; display: none;"></div>
                <button type="submit" class="auth-btn" id="saveBtn" style="display: none;">Save Changes</button>
                <a href="dashboard.html" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 1rem;">View Registration History</a>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function initProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const user = session.user;
            const metadata = user.user_metadata;

            // Populate fields from user metadata
            document.getElementById('profName').value = metadata.full_name || '';
            document.getElementById('profMobile').value = metadata.mobile || '';
            document.getElementById('profEmail').value = user.email || '';
            document.getElementById('profHandle').value = metadata.hubbler_handle || 'Not set';
            document.getElementById('profCollege').value = metadata.college_name || 'Not set';
            document.getElementById('profDept').value = metadata.department || 'Not set';
            document.getElementById('profRoll').value = metadata.roll_number || 'Not set';

            function toggleEditMode(enable) {
                const fields = ['profName', 'profMobile', 'profCollege', 'profDept', 'profRoll'];
                fields.forEach(id => {
                    const el = document.getElementById(id);
                    if (enable) el.removeAttribute('readonly');
                    else el.setAttribute('readonly', 'readonly');
                });
                document.getElementById('saveBtn').style.display = enable ? 'block' : 'none';
                document.getElementById('editProfileBtn').innerText = enable ? 'Cancel' : 'Edit';
                if (!enable) {
                    // Reset fields if canceling
                    document.getElementById('profName').value = metadata.full_name || '';
                    document.getElementById('profMobile').value = metadata.mobile || '';
                    document.getElementById('profCollege').value = metadata.college_name || 'Not set';
                    document.getElementById('profDept').value = metadata.department || 'Not set';
                    document.getElementById('profRoll').value = metadata.roll_number || 'Not set';
                    document.getElementById('saveStatus').style.display = 'none';
                }
            }

            document.getElementById('editProfileBtn').addEventListener('click', () => {
                const isEditing = document.getElementById('saveBtn').style.display === 'block';
                toggleEditMode(!isEditing);
            });

            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Simple client-side validation using existing helpers
                const name = document.getElementById('profName').value;
                const mobile = document.getElementById('profMobile').value;
                
                if (name.length < 2 || !/^\d{10}$/.test(mobile)) {
                    alert('Please enter a valid name and 10-digit mobile number.');
                    return;
                }

                const saveBtn = document.getElementById('saveBtn');
                const status = document.getElementById('saveStatus');
                
                saveBtn.disabled = true;
                status.style.display = 'block';
                status.innerText = 'Updating profile...';

                const { error } = await supabaseClient.auth.updateUser({
                    data: { 
                        full_name: name,
                        mobile: mobile,
                        college_name: document.getElementById('profCollege').value,
                        department: document.getElementById('profDept').value,
                        roll_number: document.getElementById('profRoll').value
                    }
                });

                if (error) {
                    status.innerText = 'Error: ' + error.message;
                    status.style.color = '#ff4757';
                } else {
                    status.innerText = 'Profile updated successfully!';
                    status.style.color = '#2ed573';
                    // Update local metadata fallback for cancel action
                    metadata.full_name = name;
                    metadata.mobile = mobile;
                    metadata.college_name = document.getElementById('profCollege').value;
                    metadata.department = document.getElementById('profDept').value;
                    metadata.roll_number = document.getElementById('profRoll').value;
                    setTimeout(() => toggleEditMode(false), 1500);
                }
                saveBtn.disabled = false;
            });
        }
        initProfile();
    </script>
</body>
</html>
