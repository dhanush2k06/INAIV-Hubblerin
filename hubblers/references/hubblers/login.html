<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Hubblers</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">Hubbler<span>X</span></a></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Browse</a></li>
            <li class="btn-login"><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <h2>Student Login</h2>
            <p class="form-subtitle">Welcome back. Continue where you left off.</p>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your college email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="auth-btn">Login</button>
            <div class="auth-footer">
                New here? <a href="signup.html">Create a student account</a>
            </div>
            <div class="auth-divider">
                <p class="divider-text">For partners and staff</p>
                <div class="divider-links">
                    <a href="college-login.html">College Portal</a>
                    <span>|</span>
                    <a href="admin-login.html">Hubblers Admin</a>
                </div>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
